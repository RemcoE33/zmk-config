# Uncomment the following lines to enable the Corne RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y

CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=3600000

# --- Hammerbeam artwork slideshow (nice!view, both halves) ---
# Force the custom status screen + widget ON. The shield's Kconfig.defconfig
# tries to set these via `choice ... default ZMK_DISPLAY_STATUS_SCREEN_CUSTOM`,
# but ZMK core's ZMK_DISPLAY_STATUS_SCREEN choice already defaults to the
# built-in screen, and the shield's default does NOT override it. Without these
# two lines, art.c / peripheral_status.c are never compiled (CMakeLists gates on
# CONFIG_NICE_VIEW_WIDGET_STATUS), so no artwork ends up in the firmware.
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_NICE_VIEW_WIDGET_STATUS=y

# One hex bit per artwork: bit N-1 selects artwork N. Full set = 0x3FFFFFFF.
# Starter set of 10 (artworks 1, 4, 7, ... 28) - pick your own from the previews.
CONFIG_HAMMERBEAM_SLIDESHOW_MASK=0x09249249
# CONFIG_CUSTOM_ANIMATION_SPEED=300000  # ms for the full cycle (default: 300000)

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_KEYBOARD_NAME="Corne3"
